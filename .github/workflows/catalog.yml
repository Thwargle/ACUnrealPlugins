name: Refresh plugin catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['registry/**', 'tools/**', '.github/workflows/catalog.yml']
  pull_request:
    paths: ['registry/**', 'tools/**', '.github/workflows/catalog.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/catalog.py --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: catalog-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/catalog.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish changed index
        run: |
          if ! git diff --quiet -- catalog.xml || ! git ls-files --error-unmatch catalog.xml >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- catalog.xml
            git commit -m 'Refresh plugin catalog'
            git push origin HEAD:main
          fi

